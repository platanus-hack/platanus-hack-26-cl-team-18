# Render's free plan sleeps a web service after 15 min without traffic (~50 s
# cold start, and the in-memory auctions/spend reset). Ping /health every
# 10 min so judges never hit a cold backend. One always-on free service fits
# in Render's 750 free hours a month.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend and player
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null https://team18-prod.onrender.com/health
          curl -fsS --retry 2 --max-time 30 -o /dev/null https://team18-prod-web.onrender.com/
