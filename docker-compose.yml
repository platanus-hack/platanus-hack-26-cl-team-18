# Local Postgres. `make db-up` starts it and applies db/migrations/ through
# scripts/migrate.py, the same runner (and schema_migrations ledger) Render uses.
# Don't mount the migrations into docker-entrypoint-initdb.d: that applies them
# without a ledger row, and the next `make migrate` fails on existing tables.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: team18
      POSTGRES_USER: team18
      POSTGRES_PASSWORD: team18
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team18 -d team18"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
