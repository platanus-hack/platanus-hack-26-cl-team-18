[project]
name = "team18-gpu"
version = "0.1.0"
description = "Stateless YOLO26 inference service on a remote GPU (ADR 0007)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
# The real model. Tests never need it (they use FakeModel). `uv sync --extra yolo`.
# clip/ftfy/regex: YOLOE-26 text prompts (service/vocabulary.py), pinned so
# Ultralytics never pip-installs them from git at runtime.
yolo = [
    "ultralytics>=8.4,<9",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "ftfy>=6.3",
    "regex>=2024.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.16.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PERF", "RUF"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["service", "tests"]
