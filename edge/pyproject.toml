[project]
name = "team18-edge"
version = "0.1.0"
description = "Perception agent: camera + mic on the venue laptop (ADR 0004)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "websockets>=15",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Real hardware + models. Tests never need these.
audio = [
    "sounddevice>=0.5",
    "onnxruntime>=1.20",
]
# Camera + YOLO + ArUco markers (agent/vision). `uv sync --extra vision`.
# Ultralytics itself depends on opencv-python, so the headless wheel would clash.
# Windows pins avoid a missing VCRUNTIME140_THREADS.dll with newer PyTorch.
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.4,<9",
    "lap>=0.5.12",
    # YOLOE-26 text prompts (agent/vision/vocabulary.py): Ultralytics would
    # otherwise pip-install these from git at runtime on the first bake.
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "ftfy>=6.3",
    "regex>=2024.0",
    "torch==2.6.0; sys_platform == 'win32'",
    "torchvision==0.21.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "anyio>=4.0",
    "ruff>=0.16.0",
    "mypy>=2.4.0",
]

[project.scripts]
# Local video replay: `uv run on-sight /path/to/video.mp4 --fps 3` (needs --extra vision).
on-sight = "agent.vision.replay:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
addopts = '-q -m "not live"'  # live tests spend real credits: `-m live` to run
markers = [
    "live: calls the real ElevenLabs API (needs ELEVENLABS_API_KEY); run on purpose",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored verbatim from app/contract/messages.py (make contract): never reformat.
extend-exclude = ["agent/contract.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PERF", "RUF"]
ignore = [
    "E501",                          # line length: formatter handles it
    "RUF001", "RUF002", "RUF003",    # Spanish text is intentional
    "SIM105", "UP040", "UP046", "UP047",
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

# Ultralytics and torch ship loose stubs (union return types) for the vision
# extra. Treat them as untyped so mypy gives the same answer with or without
# `--extra vision` installed (CI runs without it).
[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*", "torch", "torch.*"]
follow_imports = "skip"
follow_untyped_imports = false
